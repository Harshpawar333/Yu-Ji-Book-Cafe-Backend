service: yuji-book-cafe-pos

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}  # Mumbai region
  timeout: 29  # API Gateway max timeout (seconds)
  memorySize: 512  # MB - adjust based on performance testing
  
  # Environment variables
  environment:
    NODE_ENV: ${self:provider.stage}
    SUPABASE_URL: ${env:SUPABASE_URL, 'https://ssdlzespwcbteafrwppk.supabase.co'}
    SUPABASE_PUBLISHABLE_KEY: ${env:SUPABASE_PUBLISHABLE_KEY, 'YOUR_PUBLISHABLE_KEY'}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY, 'YOUR_SERVICE_ROLE_KEY'}
    JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-yuji-2026'}
  
  # IAM Role permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: 'arn:aws:logs:*:*:*'
  
  # API Gateway configuration
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://localhost:5174
        - https://pos-cafe.emacrontechnologies.com
        - https://cafe.theyuji.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true

functions:
  api:
    handler: lambda.handler
    description: Yu-Ji Book Café POS API - All routes in one Lambda
    events:
      - http:
          path: /api/{proxy+}
          method: ANY
          cors:
            origins:
              - http://localhost:5173
              - http://localhost:5174
              - https://pos-cafe.emacrontechnologies.com
              - https://cafe.theyuji.com
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
      - http:
          path: /api
          method: ANY
          cors:
            origins:
              - http://localhost:5173
              - http://localhost:5174
              - https://pos-cafe.emacrontechnologies.com
              - https://cafe.theyuji.com
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
            allowCredentials: true
    # Provisioned concurrency (uncomment for production to reduce cold starts)
    # provisionedConcurrency: 1

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0
    noPrependStageInUrl: true

# Package configuration
package:
  individually: false
  patterns:
    - '!node_modules/aws-sdk/**'
    - '!.git/**'
    - '!.gitignore'
    - '!README.md'
    - '!migration-backup/**'
    - '!data/**'
    - '!*.log'
    - '!.env.example'
    - '!nodemon.json'
    - '!cleanup-today.js'
    - '!migrate.js'
    - 'utils/**'
    - '!utils/fileUtils.js'
    - '!utils/hashGenerator.js'
    - '!utils/manageUsers.js'

